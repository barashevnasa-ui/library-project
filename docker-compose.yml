version: '3.8'

services:

  postgres_db:
    image: postgres:15-alpine
    container_name: library_postgres_db
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - library_network


  library_app:
    build: .
    container_name: library_springboot_app
    ports:
      - "8080:8080"
    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/library_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: system
    depends_on:
      - postgres_db
    networks:
      - library_network

volumes:
  pgdata:

networks:
  library_network:
