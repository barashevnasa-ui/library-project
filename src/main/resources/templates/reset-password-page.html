<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новый пароль — Библиотека</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="card">
    <h1>Новый пароль</h1>
    <p class="subtitle">Введите код из письма и придумайте новый пароль.</p>

    <div th:replace="~{fragments :: messages}"></div>

    <form th:action="@{/recovery/reset}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        <div class="field">
            <label for="code">Код из письма</label>
            <input id="code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required>
        </div>
        <div class="field">
            <label for="newPassword">Новый пароль</label>
            <input id="newPassword" type="password" name="newPassword" autocomplete="new-password" required>
            <p class="hint">От 8 до 20 символов: латинские буквы, цифры и хотя бы один спецсимвол.</p>
        </div>
        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/recovery}">Отправить код снова</a>
            <button class="btn" type="submit">Сменить пароль</button>
        </div>
    </form>
</main>
</body>
</html>
